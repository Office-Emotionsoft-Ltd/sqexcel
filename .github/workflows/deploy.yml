name: Deploy to GitHub Pages

on:
  push:
    branches: [main, releases-data]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Determine BASE_PATH from repository name
        run: echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
      - name: Check for releases-data branch
        id: releases_check
        run: |
          if git ls-remote --exit-code --heads origin releases-data > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout releases-data assets
        if: steps.releases_check.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: releases-data
          path: releases-data
      - name: Copy release assets into public/releases
        if: steps.releases_check.outputs.exists == 'true'
        run: |
          mkdir -p SQExcel.Portal/public/releases
          cp -r releases-data/. SQExcel.Portal/public/releases/
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          path: SQExcel.Portal
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
